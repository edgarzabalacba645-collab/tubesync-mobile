name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 22.04 fijo (no "ubuntu-latest"): la accion de Docker que
    # usabamos antes (ArtemSBulgakov/buildozer-action) se rompio porque la
    # imagen de Kivy se actualizo a una version de Ubuntu demasiado nueva
    # para la que el PPA de Java todavia no publico paquetes. Instalando
    # todo a mano sobre 22.04 (una base estable y muy probada para
    # buildozer/python-for-android) evitamos depender de ese Dockerfile de
    # terceros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cachear el SDK/NDK de Android (son ~1-2GB, acelera builds siguientes)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      # El runner trae varias JDK instaladas y JAVA_HOME apuntaba a la 11 --
      # instalar el paquete con apt no alcanza porque no cambia esa
      # variable; setup-java si la fija para el resto del job.
      - name: Fijar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Cada corrida de GitHub Actions arranca en una maquina nueva: si no
      # existe ~/.android/debug.keystore, Gradle genera uno AL AZAR para
      # firmar el build debug. Eso significa que cada build quedaria firmado
      # con una clave distinta, y Android se niega a instalar un APK encima
      # de uno anterior si la firma no coincide ("conflicto con un
      # paquete"). Usamos siempre el mismo keystore (committeado en el
      # repo, ci/debug.keystore -- es un keystore de DEBUG, no secreto, con
      # el alias/password estandar "androiddebugkey"/"android") para que
      # todos los builds queden firmados igual y se puedan instalar unos
      # sobre otros sin desinstalar antes.
      - name: Instalar keystore de debug fijo
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip python3-dev \
            autoconf libtool pkg-config zlib1g-dev cmake \
            libffi-dev libssl-dev automake build-essential ccache libltdl-dev

      - name: Instalar Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install --upgrade buildozer

      # ------------------------------------------------------------------
      # Por que compilamos ffmpeg nosotros mismos en vez de usar un binario
      # ya hecho (como se hacia antes, bajado de
      # github.com/hzw1199/Android-FFmpeg-Prebuilt):
      #
      # Ese binario prearmado estaba compilado con "--disable-gpl", y
      # resulta que el UNICO codificador de MP3 que existe (libmp3lame)
      # justamente requiere "--enable-gpl" para activarse. Por eso la app
      # bajaba el audio bien pero fallaba siempre al convertirlo a mp3, con
      # el error "Encoder not found" (el error real quedaba tapado antes por
      # otro bug de sys.stderr, ya arreglado, que lo convertia en el
      # confuso "'str' object has no attribute 'write'").
      #
      # La solucion es compilar ffmpeg desde las fuentes oficiales
      # (ffmpeg.org) con libmp3lame estatico adentro. Se cachea el
      # resultado (ligado a las versiones de ffmpeg/lame/NDK de mas abajo)
      # para que esto NO se recompile en cada build -- solo tarda unos
      # minutos la primera vez (o cuando se cambien esas versiones).
      # ------------------------------------------------------------------
      - name: Ubicar el NDK de Android (ya viene instalado en el runner)
        run: |
          set -e
          NDK_ROOT="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d -name '25.*' 2>/dev/null | sort -V | tail -1)"
          if [ -z "$NDK_ROOT" ]; then
            NDK_ROOT="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK_ROOT" ]; then
            echo "No se encontro ningun NDK preinstalado en el runner, bajando NDK r25b..."
            curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q /tmp/ndk.zip -d "$HOME/ndk-descargado"
            NDK_ROOT="$HOME/ndk-descargado/android-ndk-r25b"
          fi
          echo "Usando NDK en: $NDK_ROOT"
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Cachear ffmpeg+libmp3lame compilados (para no recompilar en cada build)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-cache
          key: ffmpeg-7.1-lame-3.100-android-api24-arm64-v8a-v1

      - name: Compilar ffmpeg con soporte MP3 (libmp3lame)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -e
          API=24
          TARGET=aarch64-linux-android
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/${TARGET}${API}-clang"
          CXX="$TOOLCHAIN/bin/${TARGET}${API}-clang++"
          AR="$TOOLCHAIN/bin/llvm-ar"
          RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          STRIP="$TOOLCHAIN/bin/llvm-strip"
          NM="$TOOLCHAIN/bin/llvm-nm"

          WORK="$HOME/ffmpeg-build"
          mkdir -p "$WORK"
          cd "$WORK"

          echo "=== Descargando LAME 3.100 ==="
          curl -fsSL -o lame.tar.gz https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          tar xzf lame.tar.gz
          cd lame-3.100
          LAME_PREFIX="$WORK/lame-install"
          ./configure \
            --host=$TARGET \
            --prefix="$LAME_PREFIX" \
            --disable-shared --enable-static \
            --disable-frontend \
            --with-pic \
            CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
            CFLAGS="-O2 -fPIC"
          make -j"$(nproc)"
          make install
          cd "$WORK"

          echo "=== Descargando FFmpeg 7.1 ==="
          curl -fsSL -o ffmpeg.tar.bz2 https://ffmpeg.org/releases/ffmpeg-7.1.tar.bz2
          tar xjf ffmpeg.tar.bz2
          cd ffmpeg-7.1

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --cc="$CC" \
            --cxx="$CXX" \
            --ar="$AR" \
            --ranlib="$RANLIB" \
            --strip="$STRIP" \
            --nm="$NM" \
            --cross-prefix="$TOOLCHAIN/bin/${TARGET}-" \
            --sysroot="$TOOLCHAIN/sysroot" \
            --enable-cross-compile \
            --enable-static --disable-shared \
            --enable-small \
            --enable-gpl --enable-version3 \
            --enable-libmp3lame \
            --extra-cflags="-O2 -fPIC -I$LAME_PREFIX/include" \
            --extra-ldflags="-L$LAME_PREFIX/lib" \
            --enable-jni --enable-mediacodec \
            --enable-avdevice --enable-avcodec --enable-avformat --enable-avutil \
            --enable-swresample --enable-swscale --enable-avfilter \
            --enable-network --enable-protocols --enable-encoders --enable-decoders \
            --enable-hwaccels --enable-muxers --enable-demuxers --enable-parsers \
            --enable-bsfs --enable-filters \
            --enable-ffmpeg --disable-ffplay --disable-ffprobe \
            --disable-doc --disable-debug \
            2>&1 | tee /tmp/ffmpeg-configure.log

          # Chequeo explicito: si por lo que sea libmp3lame no quedo
          # habilitado, mejor frenar aca con un error claro que descubrirlo
          # mas tarde en el telefono otra vez.
          if ! grep -qi "libmp3lame" /tmp/ffmpeg-configure.log; then
            echo "ERROR: libmp3lame no aparece en el resumen de ./configure -- revisar el log de arriba."
            exit 1
          fi

          make -j"$(nproc)"

          mkdir -p ~/ffmpeg-cache
          cp ffmpeg ~/ffmpeg-cache/ffmpeg-arm64-v8a
          "$STRIP" ~/ffmpeg-cache/ffmpeg-arm64-v8a || true
          chmod 755 ~/ffmpeg-cache/ffmpeg-arm64-v8a

      - name: Verificar que el ffmpeg compilado sepa codificar MP3
        run: |
          set -e
          test -f ~/ffmpeg-cache/ffmpeg-arm64-v8a
          echo "Tamano del binario:"
          ls -lh ~/ffmpeg-cache/ffmpeg-arm64-v8a
          if ! strings ~/ffmpeg-cache/ffmpeg-arm64-v8a | grep -q "^libmp3lame$"; then
            echo "ERROR: el binario compilado no tiene libmp3lame adentro."
            exit 1
          fi
          echo "OK: libmp3lame esta presente en el binario."

      - name: Copiar ffmpeg compilado al recipe de python-for-android
        run: |
          cp ~/ffmpeg-cache/ffmpeg-arm64-v8a recipes/ffmpeg_bin/ffmpeg-arm64-v8a
          chmod 755 recipes/ffmpeg_bin/ffmpeg-arm64-v8a

      # ------------------------------------------------------------------
      # BUG ENCONTRADO (build #12): python-for-android arma una carpeta
      # "dist" una sola vez y despues la reutiliza en TODOS los builds
      # siguientes con solo mirar que la LISTA DE NOMBRES de recipes sea la
      # misma -- sin mirar el contenido ni la version de cada recipe. nuestro
      # recipe de ffmpeg_bin esta escrito para "siempre rehacerse" (deberia
      # recopiar el binario en cada build), pero si ya existe un dist
      # "compatible" (mismos nombres de recipe que la vez anterior),
      # python-for-android ni siquiera llega a preguntarle al recipe si hay
      # que reconstruir: reusa el dist entero tal cual quedo la primera vez.
      # Confirmado con un build real: el ffmpeg del build #12 (que debia
      # tener el codificador de mp3 nuevo) resulto ser BYTE POR BYTE igual
      # al binario viejo sin mp3 -- quedo pegado desde el primer build
      # cacheado.
      #
      # La solucion es borrar esa carpeta "dists" antes de compilar, para
      # forzar a que la arme de nuevo (lo cual SI dispara el should_build()
      # de cada recipe -- la compilacion pesada de python/kivy/sdl2/etc
      # sigue cacheada aparte y no se rehace, esto solo repite el paso final
      # de "armar el dist" con lo que haya cambiado).
      # ------------------------------------------------------------------
      - name: Forzar que python-for-android rearme el "dist" (si no, reusa uno viejo y ningun cambio de recipe se aplica)
        run: |
          set -e
          encontrados=0
          # "dists": la carpeta armada final que python-for-android venia
          # reutilizando sin chequear nada (la causa de este fix).
          #
          # "build/venv": el venv que python-for-android usa para instalar
          # con pip los paquetes puramente-Python (yt-dlp, certifi,
          # mutagen). Como el atajo de arriba hacia que este paso TAMPOCO
          # se ejecutara desde hace varios builds, quedo un venv viejo con
          # un pip roto (mezcla de versiones -- "ImportError:
          # open_rich_spinner"), descubierto recien ahora que lo forzamos a
          # correr de nuevo. Se borra por la misma razon: que se rehaga de
          # cero, es rapido (solo paquetes puros de Python, no hay nada de
          # C/NDK para recompilar aca).
          while IFS= read -r -d '' carpeta; do
            echo "Borrando carpeta de build vieja: $carpeta"
            rm -rf "$carpeta"
            encontrados=$((encontrados + 1))
          done < <(find . "$HOME/.buildozer" -type d \( -name "dists" -o -path "*/build/venv" \) -print0 2>/dev/null)
          echo "Carpetas borradas: $encontrados"

      - name: Compilar con Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Subir el .apk como artifact (para ver logs/debug rapido)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk

      - name: Publicar el .apk en una Release (para instalar desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "TubeSync Mobile - build ${{ github.run_number }}"
          body: |
            APK generado automaticamente desde el commit ${{ github.sha }}.

            Para instalar: abrir este link desde el navegador del celular,
            descargar el .apk de "Assets" y abrirlo. Android va a pedir
            permiso para "instalar apps de origenes desconocidos" la primera
            vez -- hay que aceptarlo para este archivo.
          files: bin/*.apk
