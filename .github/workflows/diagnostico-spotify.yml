name: Diagnostico puntual - metadata de Spotify

# Workflow TEMPORAL, disparado a mano, para ver con certeza que HTML/datos
# devuelve Spotify de verdad para un link puntual, usando EXACTAMENTE los
# mismos headers/SSL que usa la app (urllib.request + _CABECERAS_HTTP) --
# en vez de adivinar por que _metadata_spotify no encontro el artista en
# el telefono real de Edgar con el mismo link que antes si funciono via
# una herramienta de fetch distinta. Se borra despues de usarlo.

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Link de Spotify a diagnosticar"
        required: true

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar _metadata_spotify real contra el link
        env:
          LINK_SPOTIFY: ${{ inputs.link }}
        run: python3 ci/diagnosticar_spotify.py "$LINK_SPOTIFY"
