name: Diagnostico puntual - metadata de Spotify

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Link de Spotify a diagnosticar"
        required: true

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar contra el link
        env:
          LINK_SPOTIFY: ${{ inputs.link }}
        run: python3 ci/diagnosticar_spotify.py "$LINK_SPOTIFY"
